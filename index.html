body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

h1{font-size:clamp(28px,6vw,46px);margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 32px}
.os{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;width:100%;max-width:760px}
.ob{background:var(--card);border:2px solid var(--line);border-bottom:6px solid var(--oc);border-radius:18px;padding:28px 12px;transition:transform .12s,border-bottom-width .12s}
.ob:hover{transform:translateY(-4px)}.ob:active{transform:translateY(3px);border-bottom-width:2px}
.ob b{display:block;font-size:44px;line-height:1;color:var(--oc);margin-bottom:10px}.ob span{font-weight:700;font-size:20px}
#app{display:none}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;font-size:22px;flex:1;min-width:140px}.top h2 i{color:var(--ac);font-style:normal}
.sw{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600}
#q{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}
.chip{white-space:nowrap;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.c{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.c:hover{transform:translateY(-3px);border-color:var(--ac)}
.h{display:flex;gap:10px;align-items:center;font-weight:700}
.ic{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--ac) 16%,transparent);display:grid;place-items:center;font-size:20px;flex:none}
.keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.k{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-size:14px;background:var(--cap);border:2px solid var(--capb);border-bottom-width:5px;border-radius:8px;padding:4px 10px;min-width:34px;text-align:center;transition:transform .09s,border-bottom-width .09s,background .09s}
.k.d{transform:translateY(3px);border-bottom-width:2px;background:var(--ac);border-color:var(--ac);color:#fff}
.p{color:var(--mut);font-size:13px}
.alt{font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px}.alt b{color:var(--ink)}
.hint{color:var(--mut);font-size:13px;margin:0 0 14px}.empty{padding:40px;text-align:center;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

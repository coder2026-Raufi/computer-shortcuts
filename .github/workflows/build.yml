name: Build apps
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, script: "build:win" }
          - { os: ubuntu-latest, script: "build:linux" }
          - { os: macos-latest, script: "build:mac" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: KeyCraft-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
